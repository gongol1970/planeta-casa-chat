<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Humano - Planeta Casa</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%23075e54"/%3E%3Cpath fill="%23fff8df" d="M32 8c-7.5 0-13.5 6-13.5 13.5v2.2c-2.4 1.6-4 4.3-4 7.3v5.5h4V31c0-2 .9-3.8 2.4-4.9l1.6-1.2v-3.4C22.5 16.3 26.8 12 32 12s9.5 4.3 9.5 9.5v3.4l1.6 1.2c1.5 1.1 2.4 2.9 2.4 4.9v5.5h4V31c0-3-1.6-5.7-4-7.3v-2.2C45.5 14 39.5 8 32 8z"/%3E%3Cpath fill="%23fff8df" d="M23 24c1.4-5 5.1-8 9-8s7.6 3 9 8c-.9 7.6-4.8 12-9 12s-8.1-4.4-9-12z"/%3E%3Cpath fill="%23fff8df" d="M16 43c2.5-4.3 8.7-7 16-7s13.5 2.7 16 7v5H16v-5z"/%3E%3Crect x="13" y="49" width="38" height="7" rx="2" fill="%23fff8df"/%3E%3Crect x="18" y="51" width="5" height="2" rx="1" fill="%23075e54"/%3E%3Crect x="25" y="51" width="5" height="2" rx="1" fill="%23075e54"/%3E%3Crect x="32" y="51" width="5" height="2" rx="1" fill="%23075e54"/%3E%3Crect x="39" y="51" width="5" height="2" rx="1" fill="%23075e54"/%3E%3Ccircle cx="44" cy="31" r="2" fill="%23075e54"/%3E%3Cpath d="M42 31h-6" stroke="%23075e54" stroke-width="2" stroke-linecap="round"/%3E%3C/svg%3E' />
  <style>
    :root {
      --green: #075e54;
      --green2: #128c7e;
      --bg: #ece5dd;
      --muted: #667085;
      --border: #ddd;
      --danger: #b42318;
      --human-bg: #fff3cd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #111;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--green);
      color: white;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      flex: 0 0 auto;
    }

    header strong { margin-right: auto; font-size: 14px; }

    input, textarea, button {
      font-family: inherit;
      font-size: 14px;
    }

    input, textarea {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      background: var(--green2);
      color: white;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    button.secondary { background: #344054; }
    button.warn { background: #f79009; color: #111; }
    button.danger { background: var(--danger); }

    #app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
      flex: 1 1 auto;
    }

    #sidebar {
      background: #f7f7f7;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      min-height: 0;
    }

    .conv {
      min-height: 56px;
      padding: 7px 9px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .conv:hover, .conv.active { background: #e7f7f3; }
    .conv.status-human { background: var(--human-bg); }
    .conv.status-human.active { background: #ffe69c; }

    .conv-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .waid {
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .phone-line {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .time-line {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .status {
      font-size: 10px;
      border-radius: 999px;
      padding: 2px 6px;
      color: white;
      background: #667085;
      white-space: nowrap;
      line-height: 1.2;
      flex: 0 0 auto;
    }

    .status.BOT { background: #1570ef; }
    .status.HUMAN { background: #12b76a; }
    .status.CLOSED { background: #667085; }

    .small {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    #main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #chatHeader {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      flex: 0 0 auto;
    }

    #chatTitle {
      font-weight: bold;
      margin-right: auto;
      word-break: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 150px;
    }

    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: stretch;
    }

    .msg {
      display: flex;
      flex-direction: column;
      width: auto;
      max-width: 72%;
      padding: 6px 9px 4px 9px;
      border-radius: 8px;
      line-height: 1.25;
      font-size: 15px;
      box-shadow: 0 1px 1px rgba(0,0,0,.08);
    }

    .msg.IN { align-self: flex-start; background: white; border-top-left-radius: 3px; }
    .msg.BOT { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 3px; }
    .msg.HUMAN { align-self: flex-end; background: #d1e9ff; border-top-right-radius: 3px; }

    .msg.SYSTEM {
      align-self: center;
      max-width: 78%;
      background: #fff6d6;
      color: #7a4b00;
      font-size: 13px;
      text-align: center;
      border-radius: 8px;
    }

    .msg-text { display: block; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; }

    .meta {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      color: #667085;
      line-height: 1.1;
      text-align: right;
    }

    .msg.IN .meta { text-align: left; }

    #composer {
      background: #f0f0f0;
      border-top: 1px solid var(--border);
      padding: 7px;
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
      padding-bottom: max(7px, env(safe-area-inset-bottom));
    }

    #messageInput {
      flex: 1;
      min-height: 38px;
      max-height: 90px;
      resize: vertical;
    }

    #empty { margin: auto; color: var(--muted); text-align: center; padding: 20px; }
    a { color: #056162; text-decoration: underline; }

    @media (max-width: 800px) {
      header { padding: 5px 6px; gap: 5px; }
      header strong { width: 100%; font-size: 13px; }
      header input { height: 31px; padding: 5px 7px; font-size: 12px; }
      header button { height: 31px; padding: 5px 8px; font-size: 12px; }
      #baseUrl { min-width: 170px !important; flex: 1 1 170px; }
      #token { min-width: 130px !important; flex: 1 1 130px; }

      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      #sidebar {
        height: 112px;
        max-height: 112px;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-y: auto;
        flex: 0 0 auto;
      }

      .conv {
        height: 56px;
        min-height: 56px;
        max-height: 56px;
        padding: 6px 8px;
      }

      .waid { font-size: 13px; }
      .phone-line, .time-line { font-size: 11px; }
      .status { font-size: 9px; padding: 2px 5px; }

      #chatHeader {
        padding: 5px 6px;
        gap: 5px;
        min-height: 36px;
      }

      #chatTitle {
        font-size: 13px;
        flex: 1 1 100%;
        min-width: 0;
      }

      #chatHeader button {
        padding: 5px 8px;
        font-size: 12px;
        border-radius: 7px;
      }

      #messages {
        padding: 7px 8px;
        gap: 4px;
      }

      .msg {
        max-width: 92%;
        font-size: 14px;
        padding: 5px 8px 4px 8px;
      }

      #composer {
        padding: 6px;
        gap: 6px;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      #messageInput {
        min-height: 36px;
        max-height: 78px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<header>
  <strong>Panel Humano - Planeta Casa</strong>
  <input id="baseUrl" placeholder="Backend URL" style="min-width:260px" />
  <input id="token" placeholder="ADMIN_TOKEN" style="min-width:180px" />
  <button onclick="saveConfig()">Guardar</button>
  <button class="secondary" onclick="loadConversations()">Actualizar</button>
</header>

<div id="app">
  <aside id="sidebar">
    <div id="conversationList"></div>
  </aside>

  <main id="main">
    <div id="chatHeader">
      <div id="chatTitle">Sin conversación seleccionada</div>
      <button onclick="takeover()">Tomar</button>
      <button class="warn" onclick="releaseBot()">Liberar bot</button>
      <button class="danger" onclick="closeConversation()">Cerrar</button>
    </div>

    <div id="messages">
      <div id="empty">Elegí una conversación de la izquierda.</div>
    </div>

    <div id="composer">
      <textarea id="messageInput" placeholder="Escribí como humano..." onkeydown="handleComposerKey(event)"></textarea>
      <button onclick="sendHuman()">Enviar</button>
    </div>
  </main>
</div>

<script>
let currentConversation = null;
let conversations = [];
let refreshTimer = null;
let firstConversationLoad = true;
let lastConversationStamp = "";
let originalTitle = document.title;
let audioCtx = null;
let soundUnlocked = false;
let titleAlertTimer = null;

const DEFAULT_BASE = "https://planeta-casa-erp.onrender.com";

function init() {
  document.getElementById("baseUrl").value = localStorage.getItem("pc_admin_base") || DEFAULT_BASE;
  document.getElementById("token").value = localStorage.getItem("pc_admin_token") || "";
  document.addEventListener("click", unlockSound, { once: true });
  document.addEventListener("keydown", unlockSound, { once: true });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) clearTitleAlert();
  });
  loadConversations();

  refreshTimer = setInterval(() => {
    loadConversations(false);
    if (currentConversation) loadMessages(currentConversation.id, false);
  }, 8000);
}

function getBase() {
  return document.getElementById("baseUrl").value.trim().replace(/\/$/, "");
}

function getToken() {
  return document.getElementById("token").value.trim();
}

function saveConfig() {
  localStorage.setItem("pc_admin_base", getBase());
  localStorage.setItem("pc_admin_token", getToken());
  alert("Guardado.");
}

async function apiGet(path) {
  const sep = path.includes("?") ? "&" : "?";
  const url = `${getBase()}${path}${sep}token=${encodeURIComponent(getToken())}`;
  const r = await fetch(url);
  return await r.json();
}

async function apiPost(path, body) {
  const sep = path.includes("?") ? "&" : "?";
  const url = `${getBase()}${path}${sep}token=${encodeURIComponent(getToken())}`;
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  return await r.json();
}

function fmtDate(s) {
  if (!s) return "";
  try { return new Date(s).toLocaleString("es-AR"); }
  catch { return s; }
}

function fmtShortTime(s) {
  if (!s) return "";
  try {
    return new Date(s).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  } catch { return s; }
}

function normalizePhone(v) {
  const raw = String(v || "").trim();
  if (!raw) return "";
  return raw.startsWith("+") ? raw : "+" + raw;
}

function isUuidLike(v) {
  const s = String(v || "").trim().replace(/^\+/, "");
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
}

function isRealWhatsAppId(v) {
  const raw = String(v || "").trim();
  if (!raw) return false;
  if (raw.startsWith("web_")) return true;
  if (raw.includes("-")) return false;
  const digits = raw.replace(/\D/g, "");
  return digits === raw.replace(/^\+/, "") && digits.length >= 8 && digits.length <= 20;
}

function isGhostConversation(c) {
  const id = String(c.id || "").trim().toUpperCase();
  const wa = String(c.wa_id || "").trim().toUpperCase();
  const name = String(c.customer_name || "").trim().toUpperCase();
  const status = String(c.status || "").trim().toUpperCase();
  const technical = ["BOT", "SYSTEM", "STATUS", "META", "WEBHOOK", "NONE", "NULL", "UNDEFINED"];
  const validStatuses = ["BOT", "HUMAN", "CLOSED"];

  if (!c.wa_id && !c.customer_name) return true;
  if (!validStatuses.includes(status)) return true;
  if (technical.includes(id) || technical.includes(wa) || technical.includes(name)) return true;
  if (isUuidLike(c.wa_id) || String(c.wa_id || "").includes("-")) return true;
  if (!isRealWhatsAppId(c.wa_id)) return true;
  return false;
}

function visibleConversations() {
  return (conversations || []).filter(c => !isGhostConversation(c));
}

function conversationStamp(items) {
  return (items || [])
    .map(c => `${c.id || ""}|${c.last_message_at || ""}|${c.status || ""}`)
    .sort()
    .join("||");
}

function unlockSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume();
    soundUnlocked = true;
  } catch (e) {
    console.warn("No pude habilitar audio", e);
  }
}

function playNotifySound() {
  try {
    if (!soundUnlocked) return;
    if (!audioCtx) unlockSound();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(660, now + 0.12);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.34);
  } catch (e) {
    console.warn("No pude reproducir sonido", e);
  }
}

function startTitleAlert() {
  if (!document.hidden) return;
  if (titleAlertTimer) return;
  let on = false;
  titleAlertTimer = setInterval(() => {
    on = !on;
    document.title = on ? "🔔 Nuevo mensaje - Panel Humano" : originalTitle;
  }, 900);
}

function clearTitleAlert() {
  if (titleAlertTimer) clearInterval(titleAlertTimer);
  titleAlertTimer = null;
  document.title = originalTitle;
}

function notifyIfNewConversationActivity(items) {
  const stamp = conversationStamp(items);
  if (firstConversationLoad) {
    firstConversationLoad = false;
    lastConversationStamp = stamp;
    return;
  }
  if (stamp && lastConversationStamp && stamp !== lastConversationStamp) {
    if (document.hidden) {
      playNotifySound();
      startTitleAlert();
    }
  }
  lastConversationStamp = stamp;
}

async function loadConversations(showErrors = true) {
  try {
    const data = await apiGet("/admin/conversations?limit=100");
    if (!data.ok) {
      if (showErrors) alert(data.error || "Error cargando conversaciones");
      return;
    }
    conversations = data.items || [];
    notifyIfNewConversationActivity(visibleConversations());
    renderConversations();
  } catch (e) {
    if (showErrors) alert("No pude conectar con el backend.");
    console.error(e);
  }
}

function renderConversations() {
  const list = document.getElementById("conversationList");
  list.innerHTML = "";

  const visible = visibleConversations();

  if (!visible.length) {
    list.innerHTML = `<div class="small" style="padding:14px">No hay conversaciones.</div>`;
    return;
  }

  visible.forEach(c => {
    const div = document.createElement("div");
    const status = String(c.status || "").toUpperCase();
    div.className = "conv" +
      (currentConversation && currentConversation.id === c.id ? " active" : "") +
      (status === "HUMAN" ? " status-human" : "");
    div.onclick = () => selectConversation(c);

    const title = c.customer_name || normalizePhone(c.wa_id) || "Sin nombre";
    const assigned = c.assigned_to ? ` · ${c.assigned_to}` : "";
    const phoneLine = `${normalizePhone(c.wa_id)}${assigned}`;

    div.innerHTML = `
      <div class="conv-line">
        <div class="waid">${escapeHtml(title)}</div>
        <span class="status ${escapeHtml(status)}">${escapeHtml(status)}</span>
      </div>
      <div class="conv-line">
        <div class="phone-line">${escapeHtml(phoneLine)}</div>
        <div class="time-line">${fmtShortTime(c.last_message_at)}</div>
      </div>
    `;
    list.appendChild(div);
  });
}

function selectConversation(c) {
  clearTitleAlert();
  currentConversation = c;
  renderConversations();
  document.getElementById("chatTitle").innerText = `${c.customer_name || normalizePhone(c.wa_id)} · ${c.status}`;
  loadMessages(c.id);
}

async function loadMessages(conversationId, showErrors = true) {
  try {
    const data = await apiGet(`/admin/messages/${encodeURIComponent(conversationId)}?limit=500`);
    if (!data.ok) {
      if (showErrors) alert(data.error || "Error cargando mensajes");
      return;
    }

    if (data.conversation) {
      currentConversation = data.conversation;
      document.getElementById("chatTitle").innerText =
        `${currentConversation.customer_name || normalizePhone(currentConversation.wa_id)} · ${currentConversation.status}`;
    }

    renderMessages(data.items || []);
  } catch (e) {
    if (showErrors) alert("No pude cargar mensajes.");
    console.error(e);
  }
}

function renderMessages(items) {
  const box = document.getElementById("messages");
  box.innerHTML = "";

  if (!items.length) {
    box.innerHTML = `<div id="empty">Sin mensajes.</div>`;
    return;
  }

  items.forEach(m => {
    const bubble = document.createElement("div");
    bubble.className = `msg ${m.direction}`;

    const text = document.createElement("div");
    text.className = "msg-text";
    text.innerHTML = linkify(escapeHtml(m.body || ""));

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${m.direction} · ${fmtDate(m.created_at)}`;

    bubble.appendChild(text);
    bubble.appendChild(meta);
    box.appendChild(bubble);
  });

  box.scrollTop = box.scrollHeight;
}

async function takeover() {
  if (!currentConversation) return alert("Elegí una conversación.");
  const data = await apiPost("/admin/takeover", {
    wa_id: currentConversation.wa_id,
    operator: "Gonzalo",
    note: "Tomado desde panel"
  });
  if (!data.ok) return alert(data.error || "Error");
  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

async function releaseBot() {
  if (!currentConversation) return alert("Elegí una conversación.");
  const data = await apiPost("/admin/release", {
    wa_id: currentConversation.wa_id,
    operator: "Gonzalo",
    note: "Liberado desde panel"
  });
  if (!data.ok) return alert(data.error || "Error");
  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

async function closeConversation() {
  if (!currentConversation) return alert("Elegí una conversación.");
  if (!confirm("¿Cerrar conversación?")) return;

  const data = await apiPost("/admin/close", {
    wa_id: currentConversation.wa_id,
    operator: "Gonzalo",
    note: "Cerrado desde panel"
  });
  if (!data.ok) return alert(data.error || "Error");
  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

async function sendHuman() {
  if (!currentConversation) return alert("Elegí una conversación.");

  const input = document.getElementById("messageInput");
  const body = input.value.trim();
  if (!body) return;

  input.value = "";

  const data = await apiPost("/admin/send", {
    wa_id: currentConversation.wa_id,
    body,
    operator: "Gonzalo"
  });

  if (!data.ok) {
    alert(data.error || "El mensaje quedó registrado, pero puede no haberse enviado.");
  }

  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

function handleComposerKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendHuman();
  }
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function linkify(text) {
  return text.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank">$1</a>'
  );
}

init();
</script>

</body>
</html>
