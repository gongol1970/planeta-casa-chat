<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Humano - Planeta Casa</title>
  <style>
    :root {
      --green: #075e54;
      --green2: #128c7e;
      --bg: #ece5dd;
      --muted: #667085;
      --border: #ddd;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #111;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--green);
      color: white;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    header strong { margin-right: auto; }

    input, textarea, button {
      font-family: inherit;
      font-size: 14px;
    }

    input, textarea {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--green2);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button.secondary { background: #344054; }
    button.warn { background: #f79009; color: #111; }
    button.danger { background: var(--danger); }

    #app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
      flex: 1;
    }

    #sidebar {
      background: #f7f7f7;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .conv {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      background: white;
      min-height: 74px;
    }

    .conv:hover, .conv.active { background: #e7f7f3; }

    .conv-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .waid {
      font-weight: bold;
      font-size: 13px;
      word-break: break-all;
    }

    .status {
      font-size: 10px;
      border-radius: 999px;
      padding: 2px 6px;
      color: white;
      background: #667085;
      white-space: nowrap;
      letter-spacing: .2px;
    }

    .status.BOT { background: #1570ef; }
    .status.HUMAN { background: #12b76a; }
    .conv.human { background: #ecfdf3; }
    .conv.human.active { background: #d1fadf; }
    .status.CLOSED { background: #667085; }

    .small {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
      line-height: 1.22;
    }

    .conv-preview {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #chatHeader {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 7px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    #chatTitle {
      font-weight: bold;
      margin-right: auto;
      word-break: break-all;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
    }

    .msg {
      display: flex;
      flex-direction: column;
      width: auto;
      max-width: 72%;
      padding: 6px 9px 4px 9px;
      border-radius: 8px;
      line-height: 1.25;
      font-size: 15px;
      box-shadow: 0 1px 1px rgba(0,0,0,.08);
    }

    .msg.IN {
      align-self: flex-start;
      background: white;
      border-top-left-radius: 3px;
    }

    .msg.BOT {
      align-self: flex-end;
      background: #dcf8c6;
      border-top-right-radius: 3px;
    }

    .msg.HUMAN {
      align-self: flex-end;
      background: #d1e9ff;
      border-top-right-radius: 3px;
    }

    .msg.SYSTEM {
      align-self: center;
      max-width: 78%;
      background: #fff6d6;
      color: #7a4b00;
      font-size: 13px;
      text-align: center;
      border-radius: 8px;
    }

    .msg-text {
      display: block;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .meta {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      color: #667085;
      line-height: 1.1;
      text-align: right;
    }

    .msg.IN .meta { text-align: left; }

    #composer {
      background: #f0f0f0;
      border-top: 1px solid var(--border);
      padding: 8px;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-height: 38px;
      max-height: 90px;
      resize: vertical;
    }

    #empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    a { color: #056162; text-decoration: underline; }

    @media (max-width: 800px) {
      body { height: 100dvh; }
      header {
        padding: 6px 8px;
        gap: 6px;
      }
      header strong {
        width: 100%;
        font-size: 14px;
      }
      header input {
        min-width: 0 !important;
        width: calc(50% - 4px);
        padding: 6px 7px;
        font-size: 12px;
      }
      header button {
        padding: 6px 8px;
        font-size: 12px;
      }

      #app { grid-template-columns: 1fr; }

      #sidebar {
        height: 164px;
        max-height: 164px;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex: 0 0 164px;
      }

      .conv {
        min-height: 82px;
        padding: 7px 10px;
      }

      .waid { font-size: 13px; }
      .small { font-size: 10.5px; }
      .status { font-size: 9px; padding: 2px 5px; }

      #chatHeader {
        padding: 6px 8px;
        gap: 5px;
      }
      #chatTitle {
        width: 100%;
        font-size: 13px;
      }
      #chatHeader button {
        padding: 6px 8px;
        font-size: 12px;
      }

      #messages { padding: 8px 9px; gap: 5px; }
      .msg { max-width: 92%; font-size: 14px; }

      #composer {
        position: sticky;
        bottom: env(safe-area-inset-bottom);
        padding: 7px;
      }
      #messageInput {
        min-height: 36px;
        max-height: 80px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<header>
  <strong>Panel Humano - Planeta Casa</strong>
  <input id="baseUrl" placeholder="Backend URL" style="min-width:260px" />
  <input id="token" placeholder="ADMIN_TOKEN" style="min-width:180px" />
  <button onclick="saveConfig()">Guardar</button>
  <button class="secondary" onclick="loadConversations()">Actualizar</button>
</header>

<div id="app">
  <aside id="sidebar">
    <div id="conversationList"></div>
  </aside>

  <main id="main">
    <div id="chatHeader">
      <div id="chatTitle">Sin conversación seleccionada</div>
      <button onclick="takeover()">Tomar</button>
      <button class="warn" onclick="releaseBot()">Liberar bot</button>
      <button class="danger" onclick="closeConversation()">Cerrar</button>
    </div>

    <div id="messages">
      <div id="empty">Elegí una conversación de la izquierda.</div>
    </div>

    <div id="composer">
      <textarea id="messageInput" placeholder="Escribí como humano..." onkeydown="handleComposerKey(event)"></textarea>
      <button onclick="sendHuman()">Enviar</button>
    </div>
  </main>
</div>

<script>
let currentConversation = null;
let conversations = [];
let refreshTimer = null;

const DEFAULT_BASE = "https://planeta-casa-erp.onrender.com";

function init() {
  document.getElementById("baseUrl").value = localStorage.getItem("pc_admin_base") || DEFAULT_BASE;
  document.getElementById("token").value = localStorage.getItem("pc_admin_token") || "";
  loadConversations();

  refreshTimer = setInterval(() => {
    loadConversations(false);
    if (currentConversation) loadMessages(currentConversation.id, false);
  }, 8000);
}

function getBase() {
  return document.getElementById("baseUrl").value.trim().replace(/\/$/, "");
}

function getToken() {
  return document.getElementById("token").value.trim();
}

function saveConfig() {
  localStorage.setItem("pc_admin_base", getBase());
  localStorage.setItem("pc_admin_token", getToken());
  alert("Guardado.");
}

async function apiGet(path) {
  const sep = path.includes("?") ? "&" : "?";
  const url = `${getBase()}${path}${sep}token=${encodeURIComponent(getToken())}`;
  const r = await fetch(url);
  return await r.json();
}

async function apiPost(path, body) {
  const sep = path.includes("?") ? "&" : "?";
  const url = `${getBase()}${path}${sep}token=${encodeURIComponent(getToken())}`;
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  return await r.json();
}

function fmtDate(s) {
  if (!s) return "";
  try { return new Date(s).toLocaleString("es-AR"); }
  catch { return s; }
}

async function loadConversations(showErrors = true) {
  try {
    const data = await apiGet("/admin/conversations?limit=100");
    if (!data.ok) {
      if (showErrors) alert(data.error || "Error cargando conversaciones");
      return;
    }
    conversations = data.items || [];
    renderConversations();
  } catch (e) {
    if (showErrors) alert("No pude conectar con el backend.");
    console.error(e);
  }
}

function renderConversations() {
  const list = document.getElementById("conversationList");
  list.innerHTML = "";

  if (!conversations.length) {
    list.innerHTML = `<div class="small" style="padding:14px">No hay conversaciones.</div>`;
    return;
  }

  const visibles = conversations.filter(isRealConversation);

  if (!visibles.length) {
    list.innerHTML = `<div class="small" style="padding:14px">No hay conversaciones reales para mostrar.</div>`;
    return;
  }

  visibles.forEach(c => {
    const div = document.createElement("div");
    const status = String(c.status || "").toUpperCase();
    div.className = "conv" +
      (status === "HUMAN" ? " human" : "") +
      (currentConversation && currentConversation.id === c.id ? " active" : "");
    div.onclick = () => selectConversation(c);

    const title = c.customer_name || formatPhone(c.wa_id);
    const assigned = c.assigned_to || "-";
    const date = fmtShortDate(c.last_message_at);

    div.innerHTML = `
      <div class="conv-top">
        <div class="waid">${escapeHtml(title)}</div>
        <span class="status ${escapeHtml(status)}">${escapeHtml(status || "BOT")}</span>
      </div>
      <div class="small conv-preview">${escapeHtml(formatPhone(c.wa_id))}</div>
      <div class="small conv-preview">Asignado: ${escapeHtml(assigned)}</div>
      <div class="small conv-preview">${escapeHtml(date)}</div>
    `;
    list.appendChild(div);
  });
}

function isRealConversation(c) {
  if (!c) return false;
  const wa = String(c.wa_id || "").trim();
  if (!wa) return false;

  // Evita chats fantasmas típicos generados por eventos internos/statuses.
  const upper = wa.toUpperCase();
  if (["BOT", "SYSTEM", "STATUS", "UNKNOWN", "NULL", "NONE", "UNDEFINED"].includes(upper)) return false;

  // WhatsApp real suele venir numérico internacional. Si no es numérico, solo lo dejamos si tiene nombre/última fecha.
  const numericLike = /^\d{8,18}$/.test(wa);
  if (!numericLike && !c.customer_name && !c.last_message_at) return false;

  return true;
}

function formatPhone(wa) {
  const s = String(wa || "").trim();
  if (!s) return "";
  if (/^\d{10,18}$/.test(s)) return "+" + s;
  return s;
}

function fmtShortDate(s) {
  if (!s) return "";
  try {
    return new Date(s).toLocaleString("es-AR", {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch { return s; }
}

function selectConversation(c) {
  currentConversation = c;
  renderConversations();
  document.getElementById("chatTitle").innerText = `${c.customer_name || formatPhone(c.wa_id)} · ${c.status}`;
  loadMessages(c.id);
}

async function loadMessages(conversationId, showErrors = true) {
  try {
    const data = await apiGet(`/admin/messages/${encodeURIComponent(conversationId)}?limit=500`);
    if (!data.ok) {
      if (showErrors) alert(data.error || "Error cargando mensajes");
      return;
    }

    if (data.conversation) {
      currentConversation = data.conversation;
      document.getElementById("chatTitle").innerText =
        `${currentConversation.customer_name || formatPhone(currentConversation.wa_id)} · ${currentConversation.status}`;
    }

    renderMessages(data.items || []);
  } catch (e) {
    if (showErrors) alert("No pude cargar mensajes.");
    console.error(e);
  }
}

function renderMessages(items) {
  const box = document.getElementById("messages");
  box.innerHTML = "";

  if (!items.length) {
    box.innerHTML = `<div id="empty">Sin mensajes.</div>`;
    return;
  }

  items.forEach(m => {
    const bubble = document.createElement("div");
    bubble.className = `msg ${m.direction}`;

    const text = document.createElement("div");
    text.className = "msg-text";
    text.innerHTML = linkify(escapeHtml(m.body || ""));

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${m.direction} · ${fmtDate(m.created_at)}`;

    bubble.appendChild(text);
    bubble.appendChild(meta);
    box.appendChild(bubble);
  });

  box.scrollTop = box.scrollHeight;
}

async function takeover() {
  if (!currentConversation) return alert("Elegí una conversación.");
  const data = await apiPost("/admin/takeover", {
    wa_id: currentConversation.wa_id,
    operator: "Gonzalo",
    note: "Tomado desde panel"
  });
  if (!data.ok) return alert(data.error || "Error");
  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

async function releaseBot() {
  if (!currentConversation) return alert("Elegí una conversación.");
  const data = await apiPost("/admin/release", {
    wa_id: currentConversation.wa_id,
    operator: "Gonzalo",
    note: "Liberado desde panel"
  });
  if (!data.ok) return alert(data.error || "Error");
  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

async function closeConversation() {
  if (!currentConversation) return alert("Elegí una conversación.");
  if (!confirm("¿Cerrar conversación?")) return;

  const data = await apiPost("/admin/close", {
    wa_id: currentConversation.wa_id,
    operator: "Gonzalo",
    note: "Cerrado desde panel"
  });
  if (!data.ok) return alert(data.error || "Error");
  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

async function sendHuman() {
  if (!currentConversation) return alert("Elegí una conversación.");

  const input = document.getElementById("messageInput");
  const body = input.value.trim();
  if (!body) return;

  input.value = "";

  const data = await apiPost("/admin/send", {
    wa_id: currentConversation.wa_id,
    body,
    operator: "Gonzalo"
  });

  if (!data.ok) {
    alert(data.error || "El mensaje quedó registrado, pero puede no haberse enviado.");
  }

  await loadConversations(false);
  await loadMessages(currentConversation.id, false);
}

function handleComposerKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendHuman();
  }
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function linkify(text) {
  return text.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank">$1</a>'
  );
}

init();
</script>

</body>
</html>
