<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Humano - Planeta Casa</title>
  <link rel="icon" type="image/png" href="./chat.png?v=2" />
  <style>
    :root{--gold:#cdae5e;--gold-dark:#9d8648;--green2:#128c7e;--bg:#ece5dd;--muted:#667085;--border:#ddd;--danger:#b42318;--human-bg:#fff3cd}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{background:var(--gold);color:white;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:0 0 auto}header strong{margin-right:auto;font-size:14px;text-shadow:0 1px 1px rgba(0,0,0,.25)}input,textarea,button,select{font-family:inherit;font-size:14px}input,textarea,select{border:1px solid var(--border);border-radius:8px;padding:7px}button{border:none;border-radius:8px;padding:7px 10px;background:var(--green2);color:white;cursor:pointer;font-weight:bold;white-space:nowrap}button.secondary{background:#344054}button.warn{background:#f79009;color:#111}button.danger{background:var(--danger)}button.gold{background:var(--gold-dark)}#app{display:grid;grid-template-columns:320px 1fr;min-height:0;flex:1 1 auto}#sidebar{background:#f7f7f7;border-right:1px solid var(--border);overflow-y:auto;min-height:0}.conv{min-height:56px;padding:7px 9px;border-bottom:1px solid var(--border);cursor:pointer;background:white;display:flex;flex-direction:column;justify-content:center;gap:3px}.conv:hover,.conv.active{background:#e7f7f3}.conv.status-human{background:var(--human-bg)}.conv.status-human.active{background:#ffe69c}.conv-line{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.waid{font-weight:bold;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.phone-line,.time-line{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time-line{flex:0 0 auto}.status{font-size:10px;border-radius:999px;padding:2px 6px;color:white;background:#667085;white-space:nowrap;line-height:1.2;flex:0 0 auto}.status.BOT{background:#1570ef}.status.HUMAN{background:#12b76a}.status.CLOSED{background:#667085}.small{color:var(--muted);font-size:11px;margin-top:2px}#main{display:flex;flex-direction:column;min-width:0;min-height:0}#chatHeader{background:white;border-bottom:1px solid var(--border);padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:0 0 auto}#chatTitle{font-weight:bold;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:150px}#messages{flex:1 1 auto;min-height:0;overflow-y:auto;padding:9px 12px;display:flex;flex-direction:column;gap:5px;align-items:stretch}.msg{display:flex;flex-direction:column;width:auto;max-width:72%;padding:6px 9px 4px;border-radius:8px;line-height:1.25;font-size:15px;box-shadow:0 1px 1px rgba(0,0,0,.08)}.msg.IN{align-self:flex-start;background:white;border-top-left-radius:3px}.msg.BOT{align-self:flex-end;background:#dcf8c6;border-top-right-radius:3px}.msg.HUMAN{align-self:flex-end;background:#d1e9ff;border-top-right-radius:3px}.msg.SYSTEM{align-self:center;max-width:78%;background:#fff6d6;color:#7a4b00;font-size:13px;text-align:center;border-radius:8px}.msg-text{display:block;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}.meta{display:block;margin-top:3px;font-size:10px;color:#667085;line-height:1.1;text-align:right}.msg.IN .meta{text-align:left}#composer{background:#f0f0f0;border-top:1px solid var(--border);padding:7px;display:flex;gap:7px;flex:0 0 auto;padding-bottom:max(7px,env(safe-area-inset-bottom))}#messageInput{flex:1;min-height:38px;max-height:90px;resize:vertical}#empty{margin:auto;color:var(--muted);text-align:center;padding:20px}#toast{position:fixed;right:14px;bottom:14px;z-index:9999;background:#111827;color:white;padding:10px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:360px;font-size:13px}a{color:#056162;text-decoration:underline}@media(max-width:800px){header{padding:5px 6px;gap:5px}header strong{width:100%;font-size:13px}header input,header select,header button{height:31px;padding:5px 7px;font-size:12px}#baseUrl{min-width:170px!important;flex:1 1 170px}#token{min-width:130px!important;flex:1 1 130px}#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#sidebar{height:112px;max-height:112px;border-right:none;border-bottom:1px solid var(--border);overflow-y:auto;flex:0 0 auto}.conv{height:56px;min-height:56px;max-height:56px;padding:6px 8px}#chatHeader{padding:5px 6px;gap:5px;min-height:36px}#chatTitle{font-size:13px;flex:1 1 100%;min-width:0}#chatHeader button{padding:5px 8px;font-size:12px;border-radius:7px}#messages{padding:7px 8px;gap:4px}.msg{max-width:92%;font-size:14px;padding:5px 8px 4px}#composer{padding:6px;gap:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}#messageInput{min-height:36px;max-height:78px;font-size:14px}}
  </style>
</head>
<body>
<header>
  <strong>Panel Humano - Planeta Casa</strong>
  <input id="baseUrl" placeholder="Backend URL" style="min-width:260px" />
  <input id="token" placeholder="ADMIN_TOKEN" style="min-width:180px" />
  <select id="soundType" title="Tipo de sonido"><option value="campana">Campana</option><option value="triple">Triple beep</option><option value="alarma">Alarma larga</option></select>
  <button onclick="saveConfig()">Guardar</button>
  <button class="secondary" onclick="loadConversations()">Actualizar</button>
  <button class="gold" onclick="enableSoundManually()" title="Habilita y prueba el sonido">Probar sonido</button>
</header>
<div id="app"><aside id="sidebar"><div id="conversationList"></div></aside><main id="main"><div id="chatHeader"><div id="chatTitle">Sin conversación seleccionada</div><button onclick="takeover()">Tomar</button><button class="warn" onclick="releaseBot()">Liberar bot</button><button class="danger" onclick="closeConversation()">Cerrar</button></div><div id="messages"><div id="empty">Elegí una conversación de la izquierda.</div></div><div id="composer"><textarea id="messageInput" placeholder="Escribí como humano..." onkeydown="handleComposerKey(event)"></textarea><button onclick="sendHuman()">Enviar</button></div></main></div><div id="toast"></div>
<script>
let currentConversation=null,conversations=[],refreshTimer=null,firstConversationLoad=true,originalTitle=document.title,audioCtx=null,soundUnlocked=false,titleAlertTimer=null,previousConversationState=new Map();
const INACTIVITY_ALERT_MS=60*60*1000,DEFAULT_BASE="https://planeta-casa-erp.onrender.com";
function init(){document.getElementById("baseUrl").value=localStorage.getItem("pc_admin_base")||DEFAULT_BASE;document.getElementById("token").value=localStorage.getItem("pc_admin_token")||"";document.getElementById("soundType").value=localStorage.getItem("pc_admin_sound")||"alarma";document.addEventListener("click",unlockSound,{once:true});document.addEventListener("keydown",unlockSound,{once:true});document.addEventListener("visibilitychange",()=>{if(!document.hidden)clearTitleAlert()});loadConversations();refreshTimer=setInterval(()=>{loadConversations(false);if(currentConversation)loadMessages(currentConversation.id,false)},8000)}
function getBase(){return document.getElementById("baseUrl").value.trim().replace(/\/$/,"")}function getToken(){return document.getElementById("token").value.trim()}function getSoundType(){return document.getElementById("soundType").value||"alarma"}
function saveConfig(){localStorage.setItem("pc_admin_base",getBase());localStorage.setItem("pc_admin_token",getToken());localStorage.setItem("pc_admin_sound",getSoundType());showToast("Guardado.")}
async function apiGet(path){const sep=path.includes("?")?"&":"?";const r=await fetch(`${getBase()}${path}${sep}token=${encodeURIComponent(getToken())}`);return await r.json()}async function apiPost(path,body){const sep=path.includes("?")?"&":"?";const r=await fetch(`${getBase()}${path}${sep}token=${encodeURIComponent(getToken())}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return await r.json()}
function fmtDate(s){if(!s)return"";try{return new Date(s).toLocaleString("es-AR")}catch{return s}}function fmtShortTime(s){if(!s)return"";try{return new Date(s).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}catch{return s}}function normalizePhone(v){const raw=String(v||"").trim();return raw?(raw.startsWith("+")?raw:"+"+raw):""}
function isUuidLike(v){const s=String(v||"").trim().replace(/^\+/,"");return/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)}function isRealWhatsAppId(v){const raw=String(v||"").trim();if(!raw)return false;if(raw.startsWith("web_"))return true;if(raw.includes("-"))return false;const digits=raw.replace(/\D/g,"");return digits===raw.replace(/^\+/,"")&&digits.length>=8&&digits.length<=20}
function isGhostConversation(c){const id=String(c.id||"").trim().toUpperCase(),wa=String(c.wa_id||"").trim().toUpperCase(),name=String(c.customer_name||"").trim().toUpperCase(),status=String(c.status||"").trim().toUpperCase(),technical=["BOT","SYSTEM","STATUS","META","WEBHOOK","NONE","NULL","UNDEFINED"],valid=["BOT","HUMAN","CLOSED"];if(!c.wa_id&&!c.customer_name)return true;if(!valid.includes(status))return true;if(technical.includes(id)||technical.includes(wa)||technical.includes(name))return true;if(isUuidLike(c.wa_id)||String(c.wa_id||"").includes("-"))return true;if(!isRealWhatsAppId(c.wa_id))return true;return false}
function visibleConversations(){return(conversations||[]).filter(c=>!isGhostConversation(c))}function conversationKey(c){return String(c.id||c.wa_id||"")}function conversationState(c){return{status:String(c.status||"").toUpperCase(),last:c.last_message_at||"",wa_id:c.wa_id||"",name:c.customer_name||""}}function parseTimeMs(s){const t=s?new Date(s).getTime():NaN;return Number.isFinite(t)?t:0}
function isInboundDirection(v){const d=String(v||"").trim().toUpperCase();return d==="IN"||d==="INBOUND"||d==="USER"||d==="CLIENT"||d==="CUSTOMER"}
async function latestMessageDirection(conversationId){try{const data=await apiGet(`/admin/messages/${encodeURIComponent(conversationId)}?limit=5`);const items=data.items||[];if(!items.length)return"";items.sort((a,b)=>parseTimeMs(b.created_at)-parseTimeMs(a.created_at));return String(items[0].direction||"").toUpperCase()}catch(e){console.warn("No pude verificar dirección del último mensaje",e);return""}}
function unlockSound(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;if(!audioCtx)audioCtx=new Ctx();if(audioCtx.state==="suspended")audioCtx.resume();soundUnlocked=true}catch(e){console.warn("No pude habilitar audio",e)}}function enableSoundManually(){unlockSound();playNotifySound(true);localStorage.setItem("pc_admin_sound",getSoundType());showToast("Sonido habilitado y probado.")}
function tone(gain,start,freq,duration,type="sine",vol=0.85){const osc=audioCtx.createOscillator();osc.type=type;osc.frequency.setValueAtTime(freq,start);osc.connect(gain);osc.start(start);osc.stop(start+duration)}
function playNotifySound(force=false){try{if(!soundUnlocked&&!force)return;if(!audioCtx)unlockSound();if(!audioCtx)return;const now=audioCtx.currentTime,gain=audioCtx.createGain(),kind=getSoundType();gain.connect(audioCtx.destination);gain.gain.setValueAtTime(0.0001,now);if(kind==="campana"){gain.gain.exponentialRampToValueAtTime(0.75,now+0.03);tone(gain,now,1046,0.42,"sine");tone(gain,now+0.18,784,0.55,"sine");gain.gain.exponentialRampToValueAtTime(0.0001,now+0.9)}else if(kind==="triple"){gain.gain.exponentialRampToValueAtTime(0.9,now+0.02);[880,660,990,740].forEach((f,i)=>tone(gain,now+i*0.16,f,0.13,"square"));gain.gain.exponentialRampToValueAtTime(0.0001,now+0.82)}else{gain.gain.exponentialRampToValueAtTime(0.95,now+0.02);[740,980,740,980,740,980].forEach((f,i)=>tone(gain,now+i*0.18,f,0.16,"square"));tone(gain,now+1.16,880,0.45,"sine");gain.gain.exponentialRampToValueAtTime(0.0001,now+1.75)}}catch(e){console.warn("No pude reproducir sonido",e)}}
function startTitleAlert(){if(!document.hidden||titleAlertTimer)return;let on=false;titleAlertTimer=setInterval(()=>{on=!on;document.title=on?"🔔 Atención humana - Panel":originalTitle},900)}function clearTitleAlert(){if(titleAlertTimer)clearInterval(titleAlertTimer);titleAlertTimer=null;document.title=originalTitle}function showToast(text){const t=document.getElementById("toast");t.textContent=text;t.style.display="block";clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>{t.style.display="none"},4500)}function firePanelNotification(text){playNotifySound();startTitleAlert();showToast(text||"Nueva actividad para atención humana")}
async function evaluateConversationNotifications(items){const nowMap=new Map(),notifications=[],checks=[];(items||[]).forEach(c=>{const key=conversationKey(c),current=conversationState(c);nowMap.set(key,current);if(firstConversationLoad)return;const prev=previousConversationState.get(key);if(!prev)return;const becameHuman=current.status==="HUMAN"&&prev.status!=="HUMAN",lastChanged=current.last&&current.last!==prev.last,prevMs=parseTimeMs(prev.last),currMs=parseTimeMs(current.last),inactive=prevMs&&currMs&&(currMs-prevMs>=INACTIVITY_ALERT_MS);if(becameHuman){notifications.push(`Derivado a humano: ${current.name||normalizePhone(current.wa_id)}`);return}if(current.status==="HUMAN"&&lastChanged&&inactive){checks.push({conversation:c,current})}});for(const chk of checks){const dir=await latestMessageDirection(chk.conversation.id);if(isInboundDirection(dir)){notifications.push(`Volvió a escribir tras más de 1 hora: ${chk.current.name||normalizePhone(chk.current.wa_id)}`)}else{console.log("Sin sonido: el último mensaje tras inactividad no fue del cliente",{conversation:chk.conversation.id,direction:dir})}}previousConversationState=nowMap;firstConversationLoad=false;if(notifications.length)firePanelNotification(notifications[0])}
async function loadConversations(showErrors=true){try{const data=await apiGet("/admin/conversations?limit=100");if(!data.ok){if(showErrors)alert(data.error||"Error cargando conversaciones");return}conversations=data.items||[];const visible=visibleConversations();await evaluateConversationNotifications(visible);renderConversations()}catch(e){if(showErrors)alert("No pude conectar con el backend.");console.error(e)}}
function renderConversations(){const list=document.getElementById("conversationList");list.innerHTML="";const visible=visibleConversations();if(!visible.length){list.innerHTML=`<div class="small" style="padding:14px">No hay conversaciones.</div>`;return}visible.forEach(c=>{const div=document.createElement("div"),status=String(c.status||"").toUpperCase();div.className="conv"+(currentConversation&&currentConversation.id===c.id?" active":"")+(status==="HUMAN"?" status-human":"");div.onclick=()=>selectConversation(c);const title=c.customer_name||normalizePhone(c.wa_id)||"Sin nombre",assigned=c.assigned_to?` · ${c.assigned_to}`:"",phoneLine=`${normalizePhone(c.wa_id)}${assigned}`;div.innerHTML=`<div class="conv-line"><div class="waid">${escapeHtml(title)}</div><span class="status ${escapeHtml(status)}">${escapeHtml(status)}</span></div><div class="conv-line"><div class="phone-line">${escapeHtml(phoneLine)}</div><div class="time-line">${fmtShortTime(c.last_message_at)}</div></div>`;list.appendChild(div)})}
function selectConversation(c){clearTitleAlert();currentConversation=c;renderConversations();document.getElementById("chatTitle").innerText=`${c.customer_name||normalizePhone(c.wa_id)} · ${c.status}`;loadMessages(c.id)}
async function loadMessages(conversationId,showErrors=true){try{const data=await apiGet(`/admin/messages/${encodeURIComponent(conversationId)}?limit=500`);if(!data.ok){if(showErrors)alert(data.error||"Error cargando mensajes");return}if(data.conversation){currentConversation=data.conversation;document.getElementById("chatTitle").innerText=`${currentConversation.customer_name||normalizePhone(currentConversation.wa_id)} · ${currentConversation.status}`}renderMessages(data.items||[])}catch(e){if(showErrors)alert("No pude cargar mensajes.");console.error(e)}}
function renderMessages(items){const box=document.getElementById("messages");box.innerHTML="";if(!items.length){box.innerHTML=`<div id="empty">Sin mensajes.</div>`;return}items.forEach(m=>{const bubble=document.createElement("div");bubble.className=`msg ${m.direction}`;const text=document.createElement("div");text.className="msg-text";text.innerHTML=linkify(escapeHtml(m.body||""));const meta=document.createElement("div");meta.className="meta";meta.textContent=`${m.direction} · ${fmtDate(m.created_at)}`;bubble.appendChild(text);bubble.appendChild(meta);box.appendChild(bubble)});box.scrollTop=box.scrollHeight}
async function takeover(){if(!currentConversation)return alert("Elegí una conversación.");const data=await apiPost("/admin/takeover",{wa_id:currentConversation.wa_id,operator:"Gonzalo",note:"Tomado desde panel"});if(!data.ok)return alert(data.error||"Error");await loadConversations(false);await loadMessages(currentConversation.id,false)}async function releaseBot(){if(!currentConversation)return alert("Elegí una conversación.");const data=await apiPost("/admin/release",{wa_id:currentConversation.wa_id,operator:"Gonzalo",note:"Liberado desde panel"});if(!data.ok)return alert(data.error||"Error");await loadConversations(false);await loadMessages(currentConversation.id,false)}async function closeConversation(){if(!currentConversation)return alert("Elegí una conversación.");if(!confirm("¿Cerrar conversación?"))return;const data=await apiPost("/admin/close",{wa_id:currentConversation.wa_id,operator:"Gonzalo",note:"Cerrado desde panel"});if(!data.ok)return alert(data.error||"Error");await loadConversations(false);await loadMessages(currentConversation.id,false)}async function sendHuman(){if(!currentConversation)return alert("Elegí una conversación.");const input=document.getElementById("messageInput"),body=input.value.trim();if(!body)return;input.value="";const data=await apiPost("/admin/send",{wa_id:currentConversation.wa_id,body,operator:"Gonzalo"});if(!data.ok)alert(data.error||"El mensaje quedó registrado, pero puede no haberse enviado.");await loadConversations(false);await loadMessages(currentConversation.id,false)}
function handleComposerKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendHuman()}}function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function linkify(text){return text.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>')}init();
</script>
</body>
</html>
